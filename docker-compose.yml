version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  cost-control-api:
    build: .
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/1
      GROK_API_KEY: ${GROK_API_KEY}
      CHEAP_MODEL: grok-4-fast
      STRONG_MODEL: grok-4
    ports:
      - "8001:8001"
